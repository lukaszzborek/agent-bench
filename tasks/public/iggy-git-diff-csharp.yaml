# Read-only git task: `git diff` between two points of real history (170 files, +14442/-2707 under foreign/csharp).
# Asked as "exists / no longer exists" because git's rename detection pairs the 3 removed files with unrelated
# new ones at 50-70% similarity, which would make an A/D/R answer ambiguous.
id: iggy-git-diff-csharp
tags: [git-history, read-only, csharp]   # report only: groups and filters results, never shown to the agent
agent: claude
model: claude-sonnet-5-5
effort: medium
template_tag: dotnet   # Serena's C# language server needs the .NET SDK
env:
  # Serena would infer Rust (most files in iggy); only the C# language server works in these images.
  SERENA_LANGUAGES: csharp
repo: https://github.com/apache/iggy.git
commit: be2265c9e
history: 200
prompt: |
  Use git history only; do not build anything and do not modify tracked files.

  Find the commit whose subject ends with `(#3800)` and compare the tree of its parent with HEAD, limited to
  `foreign/csharp/Iggy_SDK/`. Ignore rename detection: a file counts as added when its path exists at HEAD but
  not in the parent of #3800, and as removed when its path exists there but not at HEAD.

  Write `ANSWER.txt` at the repo root: first line `added=<number of added files>`, then the repo-relative path
  of every removed file, one per line, sorted. Do not create a branch, push, or open a PR.
grade: |
  set -e
  test "$(tr -d ' \r' < ANSWER.txt | grep -v '^$')" = "added=25
  foreign/csharp/Iggy_SDK/ConnectionStream/IConnectionStream.cs
  foreign/csharp/Iggy_SDK/ConnectionStream/TcpConnectionStream.cs
  foreign/csharp/Iggy_SDK/Utils/BufferSizes.cs"
timeout_min: 10
cpus: 2
memory: 4g
