# Source: iggy session c14e29a9 (2026-09-04). Pin = commit before upstream fix 7b78014c9. Only foreign/csharp is touched;
# no cargo build. Test projects multi-target net8.0;net10.0 and the image has SDK 10 only, hence -f net10.0 everywhere.
id: iggy-utf8-identifier
tags: [coding, csharp]   # report only: groups and filters results, never shown to the agent
agent: claude
model: claude-sonnet-5-5
effort: medium
template_tag: dotnet
repo: https://github.com/apache/iggy.git
commit: be2265c9ea132887a0b3414d43e431ed66d51cfd
env:
  # Keep restores of this historical snapshot independent of new vulnerability advisories.
  NuGetAudit: "false"
  # Serena would infer Rust (most files in iggy); only the C# language server works in these images.
  SERENA_LANGUAGES: csharp
setup: |
  cd foreign/csharp && dotnet restore Iggy_SDK.sln && dotnet build Iggy_SDK_Tests -f net10.0 --nologo -v q
prompt: |
  Work only in the C# SDK under `foreign/csharp`. Build and test with `-f net10.0` only (the image has no .NET 8
  runtime), e.g. `dotnet test --project Iggy_SDK_Tests -f net10.0`.

  String identifiers are encoded with the wrong length. `Identifier.String(value)` in `Iggy_SDK/Identifier.cs` sets
  `Length = value.Length` (UTF-16 code units) while `Value = Encoding.UTF8.GetBytes(value)` (UTF-8 bytes), and the
  size guard `value.Length is 0 or > 255` also counts code units. The server expects a 1-255 byte UTF-8 name
  (see `WireName` in `core/binary_protocol/src/primitives/identifier.rs`). Callers in
  `Iggy_SDK/Contracts/Tcp/TcpContracts.cs` size their buffers from `Length`, so a non-ASCII id is truncated, throws
  "Destination is too short", or overruns into the next field (e.g. `UpdateStream` with `"naïve-café"` sends
  `"naïve-caf"`).

  Fix `Identifier`, `Kinds/Partitioning`, `Headers/HeaderKey`, `Headers/HeaderValue`, and every
  `Encoding.UTF8.GetBytes(...)` / length-prefix pair in `TcpContracts.cs` so they measure UTF-8 byte counts and
  validate 1..255 bytes. Throw `ArgumentException` when the byte length is out of range. Add unit tests in
  `Iggy_SDK_Tests`. Keep the existing unit suite green and `dotnet format --verify-no-changes` clean.
  Do not create a branch, push, or open a PR.
grade: |
  set -e
  cd foreign/csharp
  # the prompt requires it; before the grade test is written, which is not formatted to the repo's rules
  dotnet format Iggy_SDK.sln --verify-no-changes --no-restore
  cat > Iggy_SDK_Tests/UtilityTests/BenchGradeTests.cs <<'EOT'
  using System;
  using Apache.Iggy;
  using Apache.Iggy.Headers;
  using Apache.Iggy.Kinds;
  using Xunit;
  namespace Apache.Iggy.Tests.UtilityTests;
  public class BenchGradeTests
  {
      // 'ä' is 2 UTF-8 bytes: 200 chars pass a char-count guard but are 400 bytes on the wire
      private static readonly string TooLong = new('ä', 200);

      [Fact]
      public void StringIdentifier_UsesUtf8ByteLength()
      {
          var id = Identifier.String("日本語");
          Assert.Equal(9, id.Length);
          Assert.Equal(9, id.Value.Length);
          Assert.Equal(5, Identifier.String("café").Length);
          Assert.ThrowsAny<ArgumentException>(() => Identifier.String(TooLong));
      }

      [Fact]
      public void PartitioningAndHeaders_UseUtf8ByteLength()
      {
          Assert.Equal(9, Partitioning.EntityIdString("日本語").Length);
          Assert.ThrowsAny<ArgumentException>(() => Partitioning.EntityIdString(TooLong));
          Assert.ThrowsAny<ArgumentException>(() => HeaderKey.FromString(TooLong));
          Assert.ThrowsAny<ArgumentException>(() => HeaderValue.FromString(TooLong));
      }
  }
  EOT
  dotnet test --project Iggy_SDK_Tests -f net10.0
# LLM-judge checks (`bench judge`), never shown to the agent; added after the default checks in judge.py.
# TcpContracts signatures are not pinned by the prompt, so the grader cannot call them.
judge:
  - "tcp-contracts: every Encoding.UTF8.GetBytes / length-prefix pair in TcpContracts.cs writes the UTF-8 byte count, not string.Length"
timeout_min: 40
cpus: 2
memory: 6g
